name: VisaFlow
options:
  bundleIdPrefix: app.capmedia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ZJ9M4ZSGKT
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

# Aucune dépendance externe. Quatre appels réseau suffisent, et une
# bibliothèque de plus serait une bibliothèque à maintenir.

targets:
  VisaFlow:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          # Le plist est généré depuis ce fichier, il ne doit pas être copié
          # une deuxième fois comme ressource.
          - "Info.plist" 
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: VisaFlow
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en, ar, zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Pour photographier une pièce demandée par l’agence.
        NSPhotoLibraryUsageDescription: Pour envoyer une pièce déjà enregistrée dans vos photos.
        UIBackgroundModes: [remote-notification]
        # Le backend réel. Les deux valeurs sont publiques : la clé anon est
        # faite pour vivre dans une app, ce sont les politiques qui protègent.
        SupabaseURL: https://ppzjkvgfgoxmdbbsphbr.supabase.co
        SupabaseAnonKey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemprdmdmZ294bWRiYnNwaGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTU4MTEsImV4cCI6MjEwNDM5MTgxMX0.rQSTYZsPOdTPTccl6I8ehfW5otPCh0On05aR5auRM4Y
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.capmedia.visaflow
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  VisaFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/VisaFlowTests]
    dependencies:
      - target: VisaFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.capmedia.visaflow.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VisaFlow:
    build:
      targets:
        VisaFlow: all
        VisaFlowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VisaFlowTests]
