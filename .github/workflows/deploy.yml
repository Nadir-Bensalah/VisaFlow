name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          # Sur GitHub Pages le site vit sous /VisaFlow/.
          VITE_BASE: /VisaFlow/
          # Le vrai backend. Sans ces deux valeurs, le site se construit en
          # démonstration : la console plateforme, le tunnel de souscription et
          # les portails clients n'atteignent rien.
          #
          # La clé « anon » est PUBLIQUE par construction : elle voyage dans
          # chaque page d'une application Supabase, et ne donne aucun droit par
          # elle-même. Ce qu'on peut lire avec, ce sont les politiques de
          # sécurité au niveau des lignes qui le décident, et elles exigent une
          # session. La clé de service, elle, ne doit JAMAIS apparaître ici.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Repli des routes profondes
        # Pages ne connait pas le routeur : toute URL inconnue doit renvoyer
        # la page unique, sinon /dossiers/ca_3 rend un 404 GitHub.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
